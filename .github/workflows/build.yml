name: Build Installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r app/requirements.txt pyinstaller

      # The exe is only an intermediate file for the installer, so it is not published.
      # Qt modules the app never imports are excluded to keep the installer small.
      - name: Build launcher EXE
        run: >
          pyinstaller --noconsole --onefile --clean --name RevitAI
          --icon app/assets/icon.ico --paths app
          --exclude-module PySide6.QtWebEngineCore --exclude-module PySide6.QtWebEngineWidgets
          --exclude-module PySide6.QtWebEngineQuick --exclude-module PySide6.QtWebChannel
          --exclude-module PySide6.QtQuick --exclude-module PySide6.QtQuickWidgets
          --exclude-module PySide6.QtQml --exclude-module PySide6.QtQuick3D
          --exclude-module PySide6.QtMultimedia --exclude-module PySide6.QtMultimediaWidgets
          --exclude-module PySide6.QtCharts --exclude-module PySide6.QtDataVisualization
          --exclude-module PySide6.QtPdf --exclude-module PySide6.QtPdfWidgets
          --exclude-module PySide6.Qt3DCore --exclude-module PySide6.Qt3DRender
          --exclude-module PySide6.QtDesigner --exclude-module PySide6.QtSql
          --exclude-module PySide6.QtTest --exclude-module PySide6.QtDBus
          --exclude-module PySide6.QtBluetooth --exclude-module PySide6.QtNfc
          --exclude-module PySide6.QtSerialPort --exclude-module PySide6.QtWebSockets
          --exclude-module PySide6.QtRemoteObjects --exclude-module PySide6.QtTextToSpeech
          --exclude-module PySide6.QtPositioning --exclude-module PySide6.QtSensors
          --collect-all PySide6 --collect-all shiboken6 --collect-all sounddevice
          --collect-all pypdf --collect-all certifi
          launcher.py

      - name: Read app version
        id: ver
        shell: pwsh
        run: |
          $ver = (Select-String -Path app/version.py -Pattern 'APP_VERSION = "(.+)"').Matches.Groups[1].Value
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.ver.outputs.version }}" installer\RevitAI.iss

      - name: Show installer size
        shell: pwsh
        run: (Get-Item installer/Output/RevitAI-Setup.exe).Length / 1MB | ForEach-Object { "Installer size: {0:N1} MB" -f $_ }

      - uses: actions/upload-artifact@v4
        with:
          name: RevitAI-Setup
          path: installer/Output/RevitAI-Setup.exe

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: installer/Output/RevitAI-Setup.exe
