name: Build Installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r app/requirements.txt pyinstaller

      # The exe is only an intermediate file for the installer, so it is not published.
      # Each PyInstaller argument is a separate array item, so a long line cannot break the options.
      - name: Build launcher EXE
        shell: pwsh
        run: |
          $excludes = @(
            "PySide6.QtWebEngineCore", "PySide6.QtWebEngineWidgets", "PySide6.QtWebEngineQuick",
            "PySide6.QtWebChannel", "PySide6.QtQuick", "PySide6.QtQuickWidgets", "PySide6.QtQml",
            "PySide6.QtQuick3D", "PySide6.QtMultimedia", "PySide6.QtMultimediaWidgets",
            "PySide6.QtCharts", "PySide6.QtDataVisualization", "PySide6.QtPdf", "PySide6.QtPdfWidgets",
            "PySide6.Qt3DCore", "PySide6.Qt3DRender", "PySide6.QtDesigner", "PySide6.QtSql",
            "PySide6.QtTest", "PySide6.QtDBus", "PySide6.QtBluetooth", "PySide6.QtNfc",
            "PySide6.QtSerialPort", "PySide6.QtWebSockets", "PySide6.QtRemoteObjects",
            "PySide6.QtTextToSpeech", "PySide6.QtPositioning", "PySide6.QtSensors"
          )
          $pyArgs = @(
            "--noconsole", "--onefile", "--clean", "--name", "RevitAI",
            "--icon", "app/assets/icon.ico", "--paths", "app",
            "--collect-all", "PySide6", "--collect-all", "shiboken6", "--collect-all", "sounddevice",
            "--collect-all", "pypdf", "--collect-all", "certifi"
          )
          foreach ($m in $excludes) { $pyArgs += @("--exclude-module", $m) }
          $pyArgs += "launcher.py"
          pyinstaller @pyArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Read app version
        id: ver
        shell: pwsh
        run: |
          $ver = (Select-String -Path app/version.py -Pattern 'APP_VERSION = "(.+)"').Matches.Groups[1].Value
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.ver.outputs.version }}" installer\RevitAI.iss

      - name: Show installer size
        shell: pwsh
        run: |
          $mb = (Get-Item installer/Output/RevitAI-Setup.exe).Length / 1MB
          Write-Output ("Installer size: {0:N1} MB" -f $mb)

      - uses: actions/upload-artifact@v4
        with:
          name: RevitAI-Setup
          path: installer/Output/RevitAI-Setup.exe

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: installer/Output/RevitAI-Setup.exe
