name: Build Installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r app/requirements.txt pyinstaller

      # The exe is only an intermediate file for the installer, so it is not published.
      # Qt modules the app never imports are excluded to keep the installer small.
      - name: Build launcher EXE
        run: >
          pyinstaller --noconsole --onefile --clean --name RevitAI
          --icon app/assets/icon.ico --paths app
          --exclude-module PySide6.QtWebEngineCore --exclude-module PySide6.QtWebEngineWidgets
          --exclude-module PySide6.QtWebEngineQuick --exclude-module PySide6.QtWebChannel
          --exclude-module PySide6.QtQuick --exclude-module PySide6.QtQuickWidgets
          --exclude-module PySide6.QtQml --exclude-module PySide6.QtQuick3D
          --exclude-module PySide6.QtMultimedia --exclude-module PySide6.QtMultimediaWidgets
          --exclude-module PySide6.QtCharts --exclude-module PySide6.QtDataVisualization
          --exclude-module PySide6.QtPdf --exclude-module PySide6.QtPdfWidgets
          --exclude-module PySide6.Qt3DCore --exclude-module
